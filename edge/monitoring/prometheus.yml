global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor for container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Edge Services Health Checks
  - job_name: 'edge-services'
    static_configs:
      - targets: 
        - 'sensor-service:6300'
        - 'sync-service:6302'
        - 'edge-orchestrator:6301'
        - 'image-ingestion:6304'
        - 'weight-associator:6303'
        - 'edge-topic-bridge:6305'
    metrics_path: '/health'
    scrape_interval: 30s

  # MQTT Broker (if it supports metrics)
  - job_name: 'mqtt-broker'
    static_configs:
      - targets: ['edge-mqtt:1883']
    scrape_interval: 60s

  # TimescaleDB (if it supports metrics)
  - job_name: 'timescaledb'
    static_configs:
      - targets: ['timescaledb:5432']
    scrape_interval: 60s

  # MinIO (if it supports metrics)
  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
    scrape_interval: 60s
