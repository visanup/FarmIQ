services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    container_name: farmiq-postgres
    environment:
      POSTGRES_DB: farmiq_cloud
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres1611
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "25432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d farmiq_cloud"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      farmiq-network: # ⬅️ per-service network mapping
        aliases:
          - farmiq-postgres # resolves too
          - postgres

  redis:
    image: redis:7-alpine
    container_name: farmiq-redis
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      farmiq-network:
        aliases:
          - farmiq-redis

  # 📊 Full-featured GUI by Redis
  redisinsight:
    image: redis/redisinsight:latest
    restart: unless-stopped
    ports:
      - "8001:8001"                      # UI: http://localhost:8001
    volumes:
      - redisinsight-data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - farmiq-network

  prometheus:
    image: prom/prometheus:latest
    container_name: farmiq-prometheus
    ports:
      - "19090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - farmiq-network

  grafana:
    image: grafana/grafana:latest
    container_name: farmiq-grafana
    ports:
      - "13000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - farmiq-network
  
  # --- Kafka (KRaft, single-broker) ---
  kafka:
    image: bitnami/kafka:3.7
    container_name: farmiq-kafka
    restart: unless-stopped
    networks: [farmiq-network]
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka_data:/bitnami/kafka
      - ./kafka-topics.yml:/opt/kafka-topics.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      start_period: 40s   # เพิ่มเวลาให้บูต
      retries: 12

  # one-shot init (หยุดเมื่อทำงานเสร็จ ถือว่าปกติ)
  kafka-init-topics:
    image: bitnami/kafka:3.7
    container_name: farmiq-kafka-init-topics
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./scripts/create-kafka-topics.sh:/create-kafka-topics.sh:ro
      - ./kafka-topics.yml:/kafka-topics.yml:ro
    command: >
      bash -c "
        echo 'Waiting for Kafka to be ready...'
        sleep 10
        echo 'Creating Kafka topics...'
        chmod +x /create-kafka-topics.sh
        /create-kafka-topics.sh
        echo 'Kafka topics initialization completed!'
      "
    networks: [farmiq-network]
    restart: "no" 

  # --- Kafka UI ---
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: farmiq-kafka-ui
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SERVER_PORT: 8080
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
    networks: [farmiq-network]
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  kafka_data:
    driver: local
  redisinsight-data:
    driver: local

networks:
  farmiq-network:
    driver: bridge
