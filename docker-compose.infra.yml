name: agroatlas

volumes:
  pgdata:
  redis-data:
  redisinsight-data:
  minio-data:
  rabbitmq-data:

networks:
  agroatlas-network:
    name: agroatlas-network
    driver: bridge

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: agroatlas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres1611
    ports:
      - "15432:5432"   # host ใช้ 15432, ใน container อ้าง postgres:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agroatlas"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [agroatlas-network]
    restart: unless-stopped

  redis:
    image: redis:7
    ports: ["6379:6379"]
    volumes: [ "redis-data:/data" ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [agroatlas-network]
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    ports: ["8001:8001"]
    volumes: [ "redisinsight-data:/data" ]
    depends_on: [redis]
    networks: [agroatlas-network]
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000", "9001:9001"]
    volumes: [ "minio-data:/data" ]
    networks: [agroatlas-network]
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq
      RABBITMQ_DEFAULT_PASS: rabbitmq
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [agroatlas-network]
    restart: unless-stopped
